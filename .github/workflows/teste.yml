
name: THE DIVISION 2 NEWS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Consultar e publicar noticias
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python bot.py
        
        - name: Salvar histórico de notícias
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add noticias_publicadas.json
            git diff --cached --quiet || git commit -m "Atualizar histórico de notícias"
            git push
