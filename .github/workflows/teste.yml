
name: Testar noticias Ubisoft

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Consultar noticias oficiais
        run: python bot.py
